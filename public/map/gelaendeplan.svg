<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="1024" height="768">
  <!-- Platzhalter-Geländeplan (schematisch). Echtes gelaendeplan.webp ersetzt dies. -->
  <rect width="1024" height="768" fill="#1a2419"/>
  <!-- Wiesenflächen -->
  <rect x="0" y="0" width="1024" height="768" fill="#1f2c1e"/>
  <path d="M0,560 Q256,520 512,560 T1024,560 L1024,768 L0,768 Z" fill="#243024"/>
  <!-- Wege -->
  <path d="M480,768 L480,520 L760,420" stroke="#3a3a32" stroke-width="26" fill="none" stroke-linecap="round"/>
  <path d="M480,520 L340,480" stroke="#3a3a32" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M480,520 L520,300" stroke="#3a3a32" stroke-width="22" fill="none" stroke-linecap="round"/>
  <!-- Teich -->
  <ellipse cx="180" cy="540" rx="90" ry="48" fill="#23415a" opacity="0.8"/>
  <!-- Camping-Areal -->
  <rect x="40" y="60" width="220" height="200" rx="18" fill="#2b3b2a" stroke="#3f5a3d" stroke-dasharray="10 8"/>
  <text x="150" y="50" text-anchor="middle" font-family="Arial" font-size="22" fill="#7da57a">Camping</text>
  <!-- Bühnen-Footprints -->
  <rect x="430" y="230" width="180" height="120" rx="10" fill="#3a352010" stroke="#f2c200" stroke-width="3"/>
  <rect x="690" y="370" width="150" height="100" rx="10" fill="#3a352010" stroke="#4caf50" stroke-width="3"/>
  <rect x="270" y="430" width="150" height="100" rx="10" fill="#3a352010" stroke="#e4572e" stroke-width="3"/>
  <!-- Rahmen -->
  <rect x="6" y="6" width="1012" height="756" rx="14" fill="none" stroke="#3f5a3d" stroke-width="3"/>
  <text x="512" y="730" text-anchor="middle" font-family="Arial" font-size="18" fill="#5d6f5b" opacity="0.7">Geländeplan – Platzhalter</text>
</svg>
