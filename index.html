<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <meta name="description" content="Festivadget – Festival-Begleiter für mehrtägige Events." />
    <!-- iOS Standalone-PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ROCK IM DORF" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>ROCK IM DORF Festival</title>
    <!-- Theme (hell/dunkel) vor dem ersten Paint setzen, um Flackern zu vermeiden. -->
    <script>
      (function () {
        try {
          var ui = JSON.parse(localStorage.getItem("festivadget:ui") || "{}");
          var theme = ui && ui.state && ui.state.theme === "light" ? "light" : "dark";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
